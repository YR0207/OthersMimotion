name: brush step

on:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]
  schedule:
    - cron: '10 0 * * *'
  watch:
    types: started
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: 恢复 token 缓存
        uses: actions/cache/restore@v4
        with:
          path: token_cache.json
          key: token-cache-${{ github.run_id }}
          restore-keys: |
            token-cache-

      - name: 初始化 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: 开始刷步
        run: |
          pip3 install requests pytz
          user='${{ secrets.USER }}'
          passwd='${{ secrets.PWD }}'
          open_get_weather='${{ secrets.OPEN_GET_WEATHER }}'
          area='${{ secrets.AREA }}'
          python3 main.py "${user}" "${passwd}" "${open_get_weather}" "${area}"

      - name: 调试-查看本地 token 缓存
        if: always()
        run: |
          if [ -f token_cache.json ]; then
            echo "=== token_cache.json 存在 ==="
            ls -l token_cache.json
            python3 debug_cache.py
          else
            echo "token_cache.json 不存在"
          fi  

      - name: 保存 token 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: token_cache.json
          key: token-cache-${{ github.run_id }}

      - name: 清理旧 token 缓存
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          REPO: ${{ github.repository }}
          CURRENT_KEY: token-cache-${{ github.run_id }}
        run: |
          set -euo pipefail

          echo "当前保留的缓存 key: $CURRENT_KEY"

          # 拉取所有 token-cache- 前缀的缓存
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/caches?key=token-cache-" > caches.json

          # 如果缓存为空则直接退出
          if [ "$(jq '.actions_caches | length' caches.json)" -eq 0 ]; then
            echo "没有需要清理的旧缓存"
            exit 0
          fi

          # 删除除 CURRENT_KEY 之外的所有缓存
          jq -r '.actions_caches[].key' caches.json | while read -r key; do
            if [ "$key" != "$CURRENT_KEY" ]; then
              echo "删除旧缓存: $key"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/caches?key=$key"
            fi
          done




