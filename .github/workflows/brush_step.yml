name: brush step

on:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]
  schedule:
    - cron: '21 0 * * *'
  watch:
    types: started
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: 恢复并保存 token 缓存
        uses: actions/cache@v4
        with:
          path: token_cache.json
          key: token-cache-master

      - name: 初始化 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: 开始刷步
        run: |
          pip3 install requests pytz
          user='${{ secrets.USER }}'
          passwd='${{ secrets.PWD }}'
          open_get_weather='${{ secrets.OPEN_GET_WEATHER }}'
          area='${{ secrets.AREA }}'
          python3 main.py "${user}" "${passwd}" "${open_get_weather}" "${area}"

      - name: 调试-查看本地 token 缓存
        if: always()
        run: |
          if [ -f token_cache.json ]; then
            echo "=== token_cache.json 存在 ==="
            ls -l token_cache.json
            echo "=== 账号数量 ==="
            python3 -c "import json; d=json.load(open('token_cache.json')); print(f'共 {len(d)} 个账号'); [print(f'- {k}: cached_at={v.get(chr(99)+chr(97)+chr(99)+chr(104)+chr(101)+chr(100)+chr(95)+chr(97)+chr(116))}') for k,v in d.items()]"
            echo "=== cached_at 时间（北京时间）==="
            python3 -c "
import json, time, datetime
from datetime import timezone
d=json.load(open('token_cache.json'))
for k,v in d.items():
    ts = v.get('cached_at', 0)
    utc = datetime.datetime.fromtimestamp(ts, tz=timezone.utc)
    bj = utc.astimezone(datetime.timezone(datetime.timedelta(hours=8)))
    print(f'{k}: {bj.strftime(\"%Y-%m-%d %H:%M:%S\")}')"
          else
            echo "token_cache.json 不存在"
          fi
