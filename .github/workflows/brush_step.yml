name: brush step

on:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]
  schedule:
    - cron: '40 0 * * *'
  watch:
    types: started
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: 恢复 token 缓存
        uses: actions/cache/restore@v4
        with:
          path: token_cache.json
          key: token-cache-${{ github.run_id }}
          restore-keys: |
            token-cache-

      - name: 初始化 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: 开始刷步
        run: |
          pip3 install requests pytz
          user='${{ secrets.USER }}'
          passwd='${{ secrets.PWD }}'
          open_get_weather='${{ secrets.OPEN_GET_WEATHER }}'
          area='${{ secrets.AREA }}'
          python3 main.py "${user}" "${passwd}" "${open_get_weather}" "${area}"

      - name: 调试-查看本地 token 缓存
        if: always()
        run: |
          if [ -f token_cache.json ]; then
            echo "=== token_cache.json 存在 ==="
            ls -l token_cache.json
            python3 debug_cache.py
          else
            echo "token_cache.json 不存在"
          fi  

      - name: 保存 token 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: token_cache.json
          key: token-cache-${{ github.run_id }}

      - name: 🧹 清理旧 token 缓存
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          CURRENT_KEY: token-cache-${{ github.run_id }}
        run: |
          caches=$(gh cache list --key token-cache- --json key --jq '.[].key')
          for key in $caches; do
            if [ "$key" != "$CURRENT_KEY" ]; then
              echo "删除旧缓存: $key"
              gh cache delete "$key" || true
            fi
          done



